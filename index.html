<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Ícones. A ordem importa: o navegador escolhe o PRIMEIRO formato que
      entende, e o SVG é o único que fica nítido em qualquer tamanho e em
      qualquer densidade de tela. O .ico existe para o pedido automático que
      todo navegador faz em /favicon.ico, venha ele de onde vier.

      Os três saem do mesmo `favicon.svg` — `npm run favicon` regera os
      derivados. Ícone mantido à mão em três tamanhos fica diferente em dois
      deles na primeira vez que alguém mexe.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Pinta a barra de endereço do Android com o preto do site. -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Os metadados vinham do `head()` do __root.tsx no Lovable, que dizia
         "Lovable App / Lovable Generated Project". Aqui viraram os do Bryan. -->
    <title>Bryan Souto — Portfólio</title>
    <meta
      name="description"
      content="Portfólio de Bryan Souto: desenvolvimento web, interfaces e projetos criativos em preto e branco."
    />
    <meta name="author" content="Bryan Souto" />
    <meta property="og:title" content="Bryan Souto — Portfólio" />
    <meta
      property="og:description"
      content="Desenvolvimento web, interfaces e projetos criativos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      NÃO existe script inline nesta página, e isso é proposital.
      A marca `js-reveal` que antes era escrita aqui mudou para `main.tsx`.

      O motivo é a Content-Security-Policy em `vercel.json`: com um único
      script inline na página, a política precisaria liberar `'unsafe-inline'`
      ou carregar um hash que muda a cada edição. Sem nenhum, ela pode dizer
      `script-src 'self'` e pronto — nenhum script injetado por terceiro roda,
      qualquer que seja o caminho da injeção.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
